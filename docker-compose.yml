name: fms

# Environment overrides come from config/.env (template: config/.env.example).
# Every variable below has a baked-in default, so `docker compose up` works
# without a .env. To customize:
#   cp config/.env.example config/.env
#   docker compose --env-file config/.env up --build
#
# Postgres is NOT part of this compose: the dev DB runs as its own standalone
# container (e.g. `my-postgres-db`) publishing POSTGRES_PORT. The backend reaches
# it through POSTGRES_HOST (default host.docker.internal on Docker Desktop).

services:
  backend:
    build:
      context: .
      dockerfile: src/api/Fms.Api/Dockerfile
    container_name: fms-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=${POSTGRES_HOST:-host.docker.internal};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-fms};Username=${POSTGRES_USER:-fms};Password=${POSTGRES_PASSWORD:-fms}"
      Entra__TenantId: ${ENTRA_TENANT_ID:-}
      Entra__ClientId: ${ENTRA_CLIENT_ID:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      CORS__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:8443}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
